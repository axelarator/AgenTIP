<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTI Console</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__brand">CTI<span class="topbar__brand-accent">//console</span></div>
    <form class="topbar__search" id="global-search-form" role="search">
      <svg class="topbar__search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <line x1="11" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="global-search-input" type="search" placeholder="Search observables — hash, domain, IP, JARM…" autocomplete="off" />
    </form>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme"></button>
  </header>

  <div class="app__body">
    <nav class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar__section">
        <a class="nav-link" data-route="overview" href="#/overview">Overview</a>
        <a class="nav-link" data-route="techniques" href="#/techniques">Technique matrix</a>
        <a class="nav-link" data-route="queue" href="#/queue">
          <span>Fingerprint queue</span>
          <span class="nav-badge" id="queue-badge" hidden></span>
        </a>
      </div>
      <div class="sidebar__section sidebar__section--clusters">
        <div class="sidebar__heading">
          <span>Clusters</span>
          <span class="sidebar__count" id="cluster-count"></span>
        </div>
        <input class="sidebar__filter" id="cluster-filter" type="search" placeholder="Filter clusters…" autocomplete="off" />
        <div class="cluster-list" id="cluster-list"></div>
      </div>
    </nav>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
