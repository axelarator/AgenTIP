[project]
name = "cti-tools"
version = "0.1.0"
description = "Self-hosted MCP server for threat cluster tracking"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cti_tools*"]

[tool.setuptools.package-data]
cti_tools = ["attack_data/*.json"]
